<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Kehadiran Praktikan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Form Kehadiran Praktikan</h1>

        <form>
            <div class="form-group">
                <label>Nama:</label>
                <input type="text" placeholder="Masukkan nama">
            </div>

            <div class="form-group">
                <label>NPM:</label>
                <input type="text" placeholder="Masukkan NPM">
            </div>

            <div class="form-group">
                <label>Kelas:</label>
                <select>
                    <option>Pilih kelas</option>
                    <option>A</option>
                    <option>B</option>
                    <option>C</option>
                </select>
            </div>

            <div class="form-group">
                <label>Tanggal:</label>
                <input type="date">
            </div>

            <div class="form-group">
                <label>Waktu:</label>
                <input type="time">
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>

    <div class="kotak-bawah">
    </div>

</body>
</html>
